<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <h1>Clientes</h1>
        <p class="page-subtitle">Acompanhe e identifique rapidamente os dados principais de cada cliente.</p>
      </div>
      <a href="form.html" class="btn btn-primary">Novo cliente</a>
    </header>
    <div class="context-bar">
      <span class="meta-label">Total cadastrado</span>
      <strong id="clientes-total" class="meta-value">-</strong>
    </div>
    <div class="busca-bar">
      <label for="busca" class="busca-label">Busca</label>
      <input type="text" id="busca" class="busca-input" placeholder="Buscar por nome ou email" autocomplete="off">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-primary sortable" data-sort="nome" title="Ordenar por nome">Nome</th>
            <th class="col-secondary sortable" data-sort="email" title="Ordenar por email">Email</th>
            <th class="sortable" data-sort="telefone" title="Ordenar por telefone">Telefone</th>
            <th class="sortable" data-sort="endereco" title="Ordenar por endereço">Endereço</th>
            <th class="sortable col-cadastro-th" data-sort="createdAt" title="Ordenar por data de cadastro">Cadastrado em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-clientes">
          <tr>
            <td colspan="6" class="empty-state">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="js/listagem.js"></script>
</body>
</html>
