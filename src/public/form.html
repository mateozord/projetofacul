<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de cliente</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <nav class="site-nav" aria-label="Principal">
      <a href="index.html" class="site-nav-link">Listagem</a>
      <a href="dashboard.html" class="site-nav-link">Painel</a>
      <span class="site-nav-link site-nav-current" aria-current="page">Formulário</span>
    </nav>
    <header class="page-header page-header-form">
      <div>
        <h1 id="form-title">Cadastro de cliente</h1>
        <p id="form-subtitle" class="page-subtitle">Preencha os dados abaixo para incluir um novo cliente.</p>
      </div>
    </header>
    <div class="form-card">
      <form id="form-cliente">
        <div class="form-section">
          <h2 class="section-title">Dados principais</h2>
          <p class="section-subtitle">Essas informações ajudam a identificar o cliente na listagem.</p>
        </div>
        <div class="form-group">
          <label for="nome">Nome <span class="required-mark">*</span></label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
          <label for="email">Email <span class="required-mark">*</span></label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-section">
          <h2 class="section-title">Contato adicional</h2>
          <p class="section-subtitle">Opcional, mas útil para tornar o cadastro mais completo.</p>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="(11) 98765-4321">
          </div>
          <div class="form-group">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco">
          </div>
        </div>
        <div id="erro-msg" class="error-msg" style="display: none;"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="index.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
  <script src="js/form.js"></script>
</body>
</html>
